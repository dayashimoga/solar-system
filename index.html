<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Solar System & Galaxy Explorer — Constellations, Stars & Exoplanets | QuickUtils</title>
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Solar System & Galaxy Explorer \u2014 Constellations, Stars & Exoplanets",
    "url": "https://solar.quickutils.top/",
    "description": "Explore the galaxy! Zoom from deep space through real constellations (Orion, Ursa Major, Cassiopeia) down to star systems with orbiting exoplanets.",
    "applicationCategory": "BrowserApplication",
    "operatingSystem": "All",
    "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
    }
}
</script>
    <link rel="canonical" href="https://solar.quickutils.top/">
    <meta name="keywords" content="QuickUtils, solar, system, code, design, productivity, online tools">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Solar System & Galaxy Explorer — Constellations, Stars & Exoplanets | QuickUtils">
    <meta property="og:description" content="Explore the galaxy! Zoom from deep space through real constellations (Orion, Ursa Major, Cassiopeia) down to star systems with orbiting exoplanets.">
    <meta property="og:url" content="https://quickutils.top/solar-system/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Explore the galaxy! Zoom from deep space through real constellations (Orion, Ursa Major, Cassiopeia) down to star systems with orbiting exoplanets.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
    <link rel="stylesheet" href="quickutils-core.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #020208; font-family: 'Inter', sans-serif; }
        #solarCanvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        #solarCanvas:active { cursor: grabbing; }
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: rgba(2,2,8,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
        .brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { color: #888; text-decoration: none; font-size: 0.85rem; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .kofi-link { color: #ff5e5b !important; font-weight: 600; }
    </style>
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <nav class="navbar">
        <a href="https://quickutils.top" class="brand">🔭 Galaxy Explorer</a>
        <div class="nav-links">
            <button id="toggleConstellations" class="btn btn-secondary btn-sm">Constellations: ON</button>
            <button id="toggleMoons" class="btn btn-secondary btn-sm">Moons: ON</button>
            <a href="https://ko-fi.com/dayatin" target="_blank" class="kofi-link">☕ Support</a>
        </div>
    </nav>
    <div id="uiOverlay" style="position:fixed;bottom:20px;left:20px;z-index:20;background:rgba(2,2,8,0.7);padding:10px 15px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(8px);">
        <div style="font-size:0.75rem;color:#888;margin-bottom:5px;font-weight:600;">ZOOM DEPTH</div>
        <div id="zoomLevelText" style="font-size:1.1rem;color:#fff;font-weight:700;">Local System</div>
        <div style="display:flex;gap:5px;margin-top:8px;">
            <button id="zoomInBtn" class="btn btn-secondary" style="padding:4px 10px;font-size:1.1rem;">+</button>
            <button id="zoomOutBtn" class="btn btn-secondary" style="padding:4px 10px;font-size:1.1rem;">-</button>
        </div>
    </div>

    <!-- Main Floating HUD -->
    <div id="mainHUD" style="position:fixed;top:70px;right:20px;background:rgba(15,15,26,0.85);padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);z-index:10;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,0.5);width:320px;">
        <p style="margin:0 0 12px;color:#fff;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px;">🔭 Space Controls</p>
        
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px;">
            <button id="z00" class="btn btn-secondary btn-sm" style="border-color: #8b5cf6;">Cosmic Web</button>
            <button id="z0" class="btn btn-secondary btn-sm">Supercluster</button>
            <button id="z1" class="btn btn-secondary btn-sm">Milky Way</button>
            <button id="z2" class="btn btn-secondary btn-sm">Constellations</button>
            <button id="z3" class="btn btn-secondary btn-sm">Solar System</button>
            <button id="zBH" class="btn btn-primary btn-sm" style="background:linear-gradient(45deg,#111,#333); border:1px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2);width:100%;">Sagittarius A*</button>
        </div>
        
        <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
            <label style="color:#bbb;font-size:0.85rem;display:flex;justify-content:space-between;margin-bottom:8px;">
                <span>⏱ Time Speed</span>
                <span id="timeSpeedVal" style="color:#aaccff;font-weight:600;">1×</span>
            </label>
            <input type="range" id="timeSpeedSlider" min="-5" max="10" step="0.5" value="1" style="width:100%;accent-color:#8b5cf6;margin-bottom:12px;">
            
            <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
                <label style="color:#aaa;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="showAsteroidBelt" checked style="accent-color:#8b5cf6;width:16px;height:16px;"> Asteroid Belts
                </label>
                <label style="color:#aaa;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="showOrbitTrails" checked style="accent-color:#8b5cf6;width:16px;height:16px;"> Orbit Trails
                </label>
                <label style="color:#aaa;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="distScaleToggle" style="accent-color:#8b5cf6;width:16px;height:16px;"> Realistic Scaling
                </label>
            </div>
            
            <div style="margin-bottom:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
                <input type="text" id="searchInput" placeholder="Search catalog (e.g. Earth, Orion)..." style="width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.5);color:#fff;margin-bottom:8px;">
                <div id="searchResults" style="max-height:100px;overflow-y:auto;background:rgba(0,0,0,0.8);border-radius:6px;font-size:0.8rem;display:none;"></div>
            </div>

            <button id="calcDistBtn" class="btn btn-secondary btn-sm" style="width:100%;margin-bottom:6px;background:rgba(139,92,246,0.2);border-color:rgba(139,92,246,0.5);">📏 Measure Distance</button>
            <button id="addPlanetBtn" class="btn btn-secondary btn-sm" style="width:100%;margin-top:6px;border:1px dashed rgba(255,255,255,0.3);">✨ Add Custom Planet</button>
        </div>
        <p id="zoomInfo" style="margin:12px 0 0;font-size:0.75rem;color:#888;text-align:center;">Scroll to zoom • Drag to pan</p>
    </div>

    <!-- Object Info Panel -->
    <div id="infoPanel" class="info-panel" style="position:fixed;top:70px;left:-400px;transition:left 0.3s;z-index:10;background:rgba(15,15,26,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);padding:24px;border-radius:12px;color:#fff;width:300px;box-shadow:0 10px 40px rgba(0,0,0,0.5);">
        <h2 id="ipTitle" style="margin:0 0 10px;font-size:1.5rem;display:flex;align-items:center;gap:8px;">Star</h2>
        <div id="ipType" style="color:#aaccff;font-size:0.9rem;margin-bottom:15px;font-weight:600;">Type</div>
        <div class="info-stats" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px;">
            <div><div style="font-size:0.7rem;color:#888;text-transform:uppercase;">Magnitude</div><div id="ipMag" style="font-weight:600;">0</div></div>
            <div><div style="font-size:0.7rem;color:#888;text-transform:uppercase;">Planets</div><div id="ipPlanets" style="font-weight:600;">0</div></div>
            <div><div style="font-size:0.7rem;color:#888;text-transform:uppercase;">Distance</div><div id="ipDist" style="font-weight:600;">Unknown</div></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button id="ipClose" class="btn btn-secondary" style="flex:1;">Close</button>
            <button id="btnLandRover" class="btn btn-primary hidden" style="flex:1;background:linear-gradient(135deg, #f97316, #ea580c);">Land Rover (3D)</button>
        </div>
    </div>
    <canvas id="solarCanvas"></canvas>
    <script src="quickutils-core.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="rover.js"></script>
    <script type="module" src="script.js"></script>
    <script src="premium_injection.js"></script>

</body>
</html>
